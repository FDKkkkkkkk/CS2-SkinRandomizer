name: Check cosmetic catalog updates

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Generate and verify candidate
        shell: pwsh
        run: ./tools/update-catalog.ps1
      - name: Save review patch
        shell: bash
        run: |
          mkdir -p dist
          git diff --binary -- cosmetic_catalog.json tools/catalog > dist/catalog-update.patch
          git diff --stat -- cosmetic_catalog.json tools/catalog >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-update
          path: dist/catalog-update.patch
          if-no-files-found: error
